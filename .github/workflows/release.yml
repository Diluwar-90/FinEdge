name: Release Pipeline

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track (internal/alpha/beta/production). Leave blank for Firebase only."
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # ---- Decode Keystore ----
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      # ---- Decode Play Store JSON ----
      - name: Decode Play Store Service Account JSON
        env:
          PLAY_STORE_JSON_BASE64: ${{ secrets.PLAY_STORE_JSON_BASE64 }}
        run: |
          mkdir -p fastlane
          echo "$PLAY_STORE_JSON_BASE64" | base64 --decode > fastlane/play-store-key.json

      # ---- Export signing & environment variables ----
      - name: Export Environment Variables
        run: |
          echo "CI_KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "FASTLANE_JSON_KEY_PATH=$(pwd)/fastlane/play-store-key.json" >> $GITHUB_ENV
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> $GITHUB_ENV
          echo "RELEASE_NOTES=${{ secrets.RELEASE_NOTES }}" >> $GITHUB_ENV
          echo "FIREBASE_TESTERS=${{ secrets.FIREBASE_TESTERS }}" >> $GITHUB_ENV

          # Track passed via Workflow Dispatch (empty = Firebase only)
          echo "PLAY_STORE_TRACK=${{ github.event.inputs.track }}" >> $GITHUB_ENV

      # ---- Install fastlane environment ----
      - name: Install Ruby & Fastlane
        run: |
          sudo gem install bundler
          bundle install

      # ---- Build Signed AAB ----
      - name: Build Signed AAB
        run: |
          ./gradlew clean bundleRelease

      # ---- Upload to Firebase (if track empty) ----
      - name: Distribute via Firebase App Distribution
        if: ${{ github.event.inputs.track == '' }}
        run: |
          bundle exec fastlane beta

      # ---- Upload to Play Store (if track provided) ----
      - name: Release to Google Play
        if: ${{ github.event.inputs.track != '' }}
        run: |
          bundle exec fastlane release

      # ---- Upload release artifact for reference ----
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
